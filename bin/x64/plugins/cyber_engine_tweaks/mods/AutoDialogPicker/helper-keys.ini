; Keys the helper presses. Use AutoHotkey key names:
; https://www.autohotkey.com/docs/v2/KeyList.htm
; Change these if you rebound dialogue keys in the game's settings.
[Keys]
; Move the dialogue highlight up / down (mouse wheel by default)
Up=WheelUp
Down=WheelDown
; Select the highlighted line (F by default)
Select=f
; How long a key is held, in milliseconds
HoldMs=60

[Game]
Exe=Cyberpunk2077.exe
; 1 = close the helper 30 seconds after the game closes
ExitWithGame=1
